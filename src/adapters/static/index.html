<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浣熊 · Project Raccoon</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/java.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-hdr">
      <div class="logo">
        <div class="logo-icon">🦝</div>
        <div><div class="logo-text">浣熊</div><div class="logo-sub">Project Raccoon v0.1</div></div>
      </div>
      <div class="llm-bar">
        <div class="llm-row">
          <span class="llm-lbl">大模型</span>
          <span class="llm-val"><span class="llm-dot mock" id="llmDot"></span><span id="llmProv">加载中...</span></span>
        </div>
        <div class="llm-model" id="llmModel">-</div>
      </div>
    </div>
    <div class="stabs">
      <button class="stab active" data-panel="skills">🧩 技能</button>
      <button class="stab" data-panel="tasks">📋 任务</button>
      <button class="stab" data-panel="history">💬 历史</button>
    </div>
    <div class="scontent">
      <div class="panel active" id="panel-skills">
        <div class="empty" id="skills-empty"><div class="empty-icon">📦</div><div>加载中...</div></div>
        <div id="skills-list"></div>
      </div>
      <div class="panel" id="panel-tasks">
        <div class="empty" id="tasks-empty"><div class="empty-icon">📋</div><div>暂无任务</div></div>
        <div id="tasks-list"></div>
      </div>
      <div class="panel" id="panel-history">
        <div class="panel-hdr">
          <span>💬 会话历史</span>
          <button class="panel-act" onclick="newConversation()">➕ 新会话</button>
        </div>
        <div class="empty" id="conv-empty"><div class="empty-icon">💬</div><div>暂无保存的会话</div></div>
        <div id="conv-list"></div>
        <div class="hist-section">
          <div class="hist-section-hdr">当前会话</div>
          <div class="empty" id="history-empty"><div class="empty-icon">📝</div><div>暂无消息</div></div>
          <div id="history-list"></div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="chat-hdr">
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      <div class="chat-hdr-title">💬 对话</div>
      <div class="chat-hdr-status" id="chatStatus">
        <span class="status-dot"></span><span>在线</span>
      </div>
      <div class="chat-acts">
        <button class="chat-act" id="pauseBtn" onclick="togglePause()">⏸️ 暂停</button>
        <button class="chat-act" onclick="newConversation()">➕ 新会话</button>
        <button class="chat-act" onclick="clearChat()">🗑️ 清空</button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🦝</div>
        <div class="welcome-title">你好，我是浣熊</div>
        <div class="welcome-sub">事件驱动的 AI 智能体框架，支持多轮对话、Skill 调用和任务管理。<br>输入消息开始对话，或试试下面的功能卡片。</div>
        <div class="feat-grid">
          <div class="feat-card" onclick="sendQuick('帮我写一首关于春天的诗')">
            <div class="feat-icon">✍️</div><div class="feat-title">创意写作</div><div class="feat-desc">诗歌、故事、文案</div>
          </div>
          <div class="feat-card" onclick="sendQuick('echo 你好世界')">
            <div class="feat-icon">🧩</div><div class="feat-title">Skill 调用</div><div class="feat-desc">触发词直接调用</div>
          </div>
          <div class="feat-card" onclick="sendQuick('/help')">
            <div class="feat-icon">📖</div><div class="feat-title">帮助中心</div><div class="feat-desc">查看所有指令</div>
          </div>
        </div>
        <div class="quick-actions">
          <button class="quick-btn" onclick="sendQuick('你好呀')">👋 打招呼</button>
          <button class="quick-btn" onclick="sendQuick('echo 测试')">🧪 测试 Echo</button>
          <button class="quick-btn" onclick="sendQuick('/skills')">🧩 查看技能</button>
          <button class="quick-btn" onclick="sendQuick('进度')">📊 任务状态</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <button class="attach-btn" id="attachBtn" title="发送文件/图片">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.48-8.48"></path></svg>
        </button>
        <input type="file" id="fileInput" style="display:none" accept="image/*,video/*,audio/*,.pdf,.zip,.txt,.md,.py,.js,.json,.csv">
        <textarea id="input" rows="1" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" autofocus></textarea>
        <button class="send-btn" id="sendBtn" title="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
      <div class="input-hint"><span>按 Enter 发送 · Shift+Enter 换行 · 📎 可发送文件</span><span id="charCount">0 字</span></div>
    </div>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
