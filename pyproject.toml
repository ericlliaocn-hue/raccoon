[project]
name = "raccoon"
version = "0.5.0"
description = "Raccoon - 事件驱动的 AI 智能体框架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "aiosqlite>=0.19",
    "gitpython>=3.1",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "structlog>=24.1",
    "httpx>=0.26",
    "openai>=1.12",
    "psutil>=5.9",
    "python-multipart>=0.0.6",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "aiosmtplib>=3.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
]

[project.scripts]
raccoon = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that exercise integration paths and may need external services",
]

[tool.ruff]
line-length = 100
target-version = "py311"
